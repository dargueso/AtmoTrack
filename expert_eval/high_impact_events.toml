# High-impact DANA events: daily precipitation > 400 mm or catastrophic floods.
# Source: DANASv3.pdf (Keynote), slides 11-26. `maps` are the ERA5 map times shown on the slides (UTC).
#
# build_cases.py --high-impact high_impact_events.toml adds one case per event. The case time is chosen
# so that the expert's +/-24 h loop covers as many of the slide maps as possible (ties: the latest map).
# Set `case_time` to override that choice. These cases are tagged "high_impact", appear in every
# session (settings.toml [session] high_impact_fraction) and have their own section in admin.py report.

