[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
[project]
# ---------------------------------------------------------------------------
name = "atmotrack"
version = "1.0.0"
description = "Atmospheric system tracking from ERA5 reanalysis data"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Daniel Argüeso", email = "d.argueso@uib.es" },
]
requires-python = ">=3.11"
keywords = ["atmospheric-science", "ERA5", "cyclone-tracking", "cut-off-lows"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "xarray>=2023.1",
    "pandas>=2.0",
    "netCDF4>=1.6",
    "scikit-image>=0.21",
    "metpy>=1.5",
    "joblib>=1.3",
]

[project.optional-dependencies]
download = ["cdsapi>=0.7", "python-dateutil>=2.8"]
misc     = ["geopandas>=0.14", "cartopy>=0.22", "regionmask>=0.10", "scipy>=1.10"]
dev      = ["pytest>=7.0", "ruff>=0.4"]

# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
# Only package the source files; data dirs are excluded automatically
exclude = ["data_era5*", "data_tracking*", "events_stats*"]

# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
# ---------------------------------------------------------------------------
testpaths = ["test_smoke.py"]
addopts   = "-v"
# Mark the full pipeline tests as slow so they can be skipped in CI if needed:
#   pytest -m "not slow"
markers = [
    "slow: marks tests as slow (full tracking pipeline)",
]

# ---------------------------------------------------------------------------
[tool.ruff]
# ---------------------------------------------------------------------------
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W: pycodestyle  F: pyflakes  I: isort  UP: pyupgrade  NPY: numpy style
select = ["E", "W", "F", "I", "UP", "NPY"]
ignore = [
    "E501",   # line too long — handled by line-length setting above
    "E741",   # ambiguous variable name (l, O, I) — common in science code
    "UP007",  # Use X | Y for type annotations — not yet enforced here
]

[tool.ruff.lint.isort]
known-first-party = ["atmotrack_config", "tracking_functions", "constants", "utils"]
