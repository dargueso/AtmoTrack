[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
[project]
# ---------------------------------------------------------------------------
name = "atmotrack"
version = "1.0.0"
description = "Atmospheric system tracking (cut-off lows, cyclones, tropical cyclones, jets, atmospheric rivers) from CF-compliant NetCDF data"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Daniel Argüeso", email = "d.argueso@uib.es" },
]
requires-python = ">=3.11"
keywords = [
    "atmospheric-science",
    "ERA5",
    "reanalysis",
    "cyclone-tracking",
    "cut-off-lows",
    "atmospheric-rivers",
    "jet-stream",
    "tropical-cyclones",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "xarray>=2023.1",
    "pandas>=2.0",
    "netCDF4>=1.6",
    "scikit-image>=0.21",
    "metpy>=1.5",
    "joblib>=1.3",
]

[project.urls]
Homepage = "https://github.com/dargueso/AtmoTrack"
Repository = "https://github.com/dargueso/AtmoTrack"
Issues = "https://github.com/dargueso/AtmoTrack/issues"
Changelog = "https://github.com/dargueso/AtmoTrack/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Land/sea test used by the tropical cyclone filter (atmotrack-tc)
tc       = ["cartopy>=0.22", "shapely>=2.0"]
# Copernicus CDS download (atmotrack-download-era5)
download = ["cdsapi>=0.7", "python-dateutil>=2.8"]
dev      = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
atmotrack-col           = "atmotrack.cli.col:main"
atmotrack-cy-z500       = "atmotrack.cli.cy_z500:main"
atmotrack-cy-slp        = "atmotrack.cli.cy_slp:main"
atmotrack-tc            = "atmotrack.cli.tc:main"
atmotrack-jet           = "atmotrack.cli.jet:main"
atmotrack-ar-850        = "atmotrack.cli.ar850:main"
atmotrack-ar-ivt        = "atmotrack.cli.ar_ivt:main"
atmotrack-download-era5 = "atmotrack.cli.download_era5:main"
atmotrack-config        = "atmotrack.cli.config_cmd:main"

# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
# ---------------------------------------------------------------------------
where = ["src"]

[tool.setuptools.package-data]
atmotrack = ["config.toml"]

# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
# ---------------------------------------------------------------------------
testpaths = ["tests"]
addopts   = "-v"
markers = [
    "slow: marks tests as slow (full tracking pipeline)",
]

# ---------------------------------------------------------------------------
[tool.ruff]
# ---------------------------------------------------------------------------
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W: pycodestyle  F: pyflakes  I: isort  UP: pyupgrade  NPY: numpy style
select = ["E", "W", "F", "I", "UP", "NPY"]
ignore = [
    "E501",   # line too long — handled by line-length setting above
    "E741",   # ambiguous variable name (l, O, I) — common in science code
    "UP007",  # Use X | Y for type annotations — not yet enforced here
]

[tool.ruff.lint.isort]
known-first-party = ["atmotrack"]
