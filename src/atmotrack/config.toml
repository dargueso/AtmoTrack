# =============================================================================
# config.toml — AtmoTrack configuration
#
# Edit this file to set thresholds, paths, and tracking options.
# All paths may be absolute or relative to the working directory where
# the atmotrack-* commands are launched.
#
# Lookup order: $ATMOTRACK_CONFIG, then ./config.toml, then this packaged default.
# Run `atmotrack-config --init` to copy this file into the current directory.
# =============================================================================

# ---------------------------------------------------------------------------
[general]
# ---------------------------------------------------------------------------
DT = 6          # tracking time step [hours]; every input stream is brought to this step
                # (instantaneous fields subsampled, precipitation accumulated).
                # Streams at a finer step must divide DT; run atmotrack-check-input to verify.

# ---------------------------------------------------------------------------
[paths]
# ---------------------------------------------------------------------------
# Directory containing ERA5 input NetCDF files (used by atmotrack-download-era5)
data_era5     = "./data_era5"

# Directory containing input data for tracking (any source; defaults to data_era5)
data_input    = "./data_era5"

# Directory where tracking output NetCDF files are written
data_tracking = "./data_tracking"

# MCS tracking output path prefix (used by MCS_tracking)
path_in = "./data_tracking"

# ---------------------------------------------------------------------------
[mcs]
# MCS (Mesoscale Convective System) tracking options
# ---------------------------------------------------------------------------
smooth_sigma_pr   = 0      # Gaussian std for precipitation smoothing
thres_pr          = 5      # precipitation threshold [mm/h]
min_time_pr       = 3      # minimum lifetime of PR feature [hours]
min_area_pr       = 500    # minimum area of precipitation feature [km²]

smooth_sigma_bt   = 0      # Gaussian std for Tb smoothing
thres_bt          = 241    # minimum brightness temperature of cloud shield [K]
min_time_bt       = 5      # minimum lifetime of cloud shield [hours]
min_area_bt       = 1000   # minimum area of cloud shield [km²]

MCS_min_area      = 500    # minimum area of MCS precipitation object [km²]
MCS_thres_pr      = 5      # minimum max precipitation [mm/h]
MCS_thres_peak_pr = 15     # minimum lifetime peak of MCS precipitation [mm/h]
MCS_thres_bt      = 225    # minimum brightness temperature [K]
MCS_min_area_bt   = 1000   # minimum cloud area size [km²]
MCS_min_time      = 5      # minimum lifetime of MCS [hours]

# ---------------------------------------------------------------------------
[cy_acy_z500]
# 500 hPa Cyclone / Anticyclone tracking options
# ---------------------------------------------------------------------------
z500_smooth_method   = "uniform" # small-scale smoothing method: "uniform" or "gaussian"
z500_smooth_scale_km = 100       # smoothing scale [km] — window size (uniform) or sigma (gaussian)
z500_smooth_low_anom = -80       # lower threshold for smooth z500 anomaly [m]
z500_smooth_high_anom = 70     # upper threshold for smooth z500 anomaly [m]
MinTimeCY            = 12      # minimum lifetime of cyclones [hours]
MinTimeACY           = 12      # minimum lifetime of anticyclones [hours]
MaxDistCYFeatures    = 500000  # max distance between features to split [m]

# ---------------------------------------------------------------------------
[cy_acy_slp]
# Surface (SLP) Cyclone / Anticyclone tracking options
# ---------------------------------------------------------------------------
slp_smooth_low_anom  = -5        # cyclone anomaly threshold [hPa]
slp_smooth_high_anom = 12         # anticyclone anomaly threshold [hPa]
MinTimeCY_SLP        = 12         # minimum cyclone lifetime [hours]
MinTimeACY_SLP       = 12         # minimum anticyclone lifetime [hours]
slp_breakup_method   = "watershed" # "watershed" or "breakup"
watershed_time_window_h = 12     # temporal smoothing of the watershed distance field [hours]

# ---------------------------------------------------------------------------
[col]
# Cut-Off Low tracking options
# ---------------------------------------------------------------------------
col_buffer           = 600000    # search area around the cyclone [m]
col_min_dur          = 24        # minimum lifetime of COL [hours]
col_z500_threshold_min = 9999    # minimum z500 to consider a COL [m]; 9999 = disabled
col_region           = [-15, 10, 30, 45]  # [lon_min, lon_max, lat_min, lat_max]
col_percent_isolation = 0.90     # fraction of ring points that must exceed threshold
col_ring_isolation   = 600000    # radius of isolation ring [m]
col_thres_isolation  = 60        # min z500 difference between min and ring [m]
col_min_lat          = 25        # all object grid points must be north of this [°N]
col_max_lat          = 60        # all object grid points must be south of this [°N]
col_min_lon          = -29       # all object grid points must be east of this [°E]
col_max_lon          = 19        # all object grid points must be west of this [°E]

# ---------------------------------------------------------------------------
[fronts]
# Front tracking options
# ---------------------------------------------------------------------------
front_treshold = 0.5    # frontal diagnostic threshold
MinAreaFR      = 50000  # minimum front area [km²]

# ---------------------------------------------------------------------------
[jetstream]
# Jet stream tracking options
# ---------------------------------------------------------------------------
js_min_anomaly   = 24.0      # minimum 200 hPa wind speed anomaly [m/s]
MinTimeJS        = 24        # minimum lifetime of jet objects [hours]
js_breakup_method = "breakup" # "breakup" or "watershed"

# ---------------------------------------------------------------------------
[atmospheric_rivers]
# Atmospheric River tracking options
# ---------------------------------------------------------------------------
# 850 hPa moisture flux approach
MinMSthreshold = 0.13   # minimum moisture flux threshold [g/g · m/s]
MinTimeMS      = 9      # minimum lifetime of moisture stream [hours]
MinAreaMS      = 100000 # minimum area of moisture stream [km²]

# IVT approach
IVTthreshold   = 500.0  # IVT threshold [kg m⁻¹ s⁻¹]
MinTimeIVT     = 9      # minimum lifetime of IVT-AR [hours]

# ---------------------------------------------------------------------------
[tropical_cyclones]
# Tropical Cyclone tracking options
# ---------------------------------------------------------------------------
TC_lat_genesis  = 30.0   # max abs latitude of genesis point [°]
TC_deltaT_core  = 2.0    # warm-core ΔT (center vs object mean) threshold [K]
TC_T850min      = 273.15 # minimum 850 hPa core temperature [K]
TC_Pmin         = 980.0  # minimum SLP threshold [hPa]
TC_lat_max      = 60.0   # maximum abs latitude cutoff [°]
TC_min_duration_h = 48   # minimum lifetime of the surface cyclone object [hours]
TC_persistence_h  = 24   # warm core and SLP < TC_Pmin must hold for at least this long [hours]

# ---------------------------------------------------------------------------
[data_source]
# Input data configuration — edit these when switching from ERA5 to another
# source (WRF, CESM, regional models, …).  The defaults reproduce the current
# ERA5 behaviour exactly, so existing ERA5 users need not change anything.
# ---------------------------------------------------------------------------

# ── Coordinate names ────────────────────────────────────────────────────────
# Name of the latitude coordinate / variable in input NetCDF files.
# For ERA5: "latitude" (1-D).  For WRF: "XLAT" (2-D).
lat_var   = "latitude"

# Name of the longitude coordinate / variable.
# For ERA5: "longitude" (1-D).  For WRF: "XLONG" (2-D).
lon_var   = "longitude"

# Set to true when lat/lon arrays are already 2-D (e.g. WRF Lambert Conformal).
# When false (ERA5-style), 1-D arrays are expanded with np.meshgrid.
lat_is_2d = false

# Name of the CF-compliant time dimension.
# For ERA5: "valid_time".  For WRF/most CF files: "time".
time_var  = "valid_time"

# ── Glob patterns (relative to data_input) ──────────────────────────────────
# Shell-style wildcards; * matches any characters including digits.
# Multiple matching files are merged automatically into one dataset.
# Files do NOT need to be organised one-per-year.
pattern_z500 = "era5_daily_500hPa_*.nc"
pattern_z200 = "era5_daily_200hPa_*.nc"
pattern_z850 = "era5_daily_850hPa_*.nc"
pattern_slp  = "era5_daily_SLP_*.nc"
pattern_pr   = "era5_daily_PR_*.nc"
pattern_ivt  = "era5_daily_IVT_*.nc"

# ── Variable names within each input file ───────────────────────────────────
var_z500 = "z"      # 500 hPa geopotential [m²/s²]
var_u200 = "u"      # 200 hPa u-wind [m/s]
var_v200 = "v"      # 200 hPa v-wind [m/s]
var_u850 = "u"      # 850 hPa u-wind [m/s]
var_v850 = "v"      # 850 hPa v-wind [m/s]
var_t850 = "t"      # 850 hPa temperature [K]
var_msl  = "msl"    # mean sea-level pressure [Pa]
var_pr   = "tp"     # total precipitation [m] (resampled to 6-hourly and scaled to mm)
var_q850 = "q"      # 850 hPa specific humidity [kg/kg]
var_ivte = "ivte"   # eastward integrated vapour transport [kg m⁻¹ s⁻¹]
var_ivtn = "ivtn"   # northward integrated vapour transport [kg m⁻¹ s⁻¹]

# ---------------------------------------------------------------------------
[prepare]
# atmotrack-prepare: convert any input into AtmoTrack's canonical per-year files
# (atmotrack_<stream>_<year>.nc under output_dir, ERA5 variable names and units,
# all streams at [general] DT).  atmotrack-check-input reports what will change.
# ---------------------------------------------------------------------------
output_dir      = "./data_prepared"
lon_convention  = "-180..180"  # "-180..180" or "0..360" (regular grids are re-ordered accordingly)
lat_order       = "keep"       # "keep", "descending" (ERA5 style) or "ascending"; regular grids only
pr_kind         = "auto"       # "auto" (from units), "accumulated" (amount per step) or "rate"
interpolate_time = false       # allow linear interpolation when a stream is coarser than DT

# Source units when the files carry no (or wrong) `units` attribute, e.g.
# units_z = "m"  (geopotential height) or units_msl = "hPa".  Keys: units_<var>.
