name: atmotrack
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.13
  # Core scientific stack
  - numpy>=1.24
  - scipy>=1.10
  - xarray>=2023.1
  - pandas>=2.0
  - dask
  # NetCDF I/O
  - netCDF4>=1.6
  # Image processing (watershed breakup)
  - scikit-image>=0.21
  # Meteorological calculations
  - metpy>=1.5
  # Parallelism
  - joblib>=1.3
  # Progress bars
  - tqdm
  # Plotting
  - matplotlib>=3.7
  - cartopy>=0.22
  # Geospatial / mask utilities (used by Misc/ scripts)
  - geopandas>=0.14
  - regionmask>=0.10
  - rasterio
  # CDS download (download_ERA5.py)
  - python-dateutil>=2.8
  # Development / testing
  - pytest>=7.0
  - ruff>=0.4
  # pip-only packages
  - pip
  - pip:
    - cdsapi>=0.7
