name: atmotrack
channels:
  - conda-forge
dependencies:
  - python>=3.11
  # Core scientific stack
  - numpy>=1.24
  - scipy>=1.10
  - xarray>=2023.1
  - pandas>=2.0
  # NetCDF I/O
  - netCDF4>=1.6
  # Image processing (watershed breakup)
  - scikit-image>=0.21
  # Meteorological calculations
  - metpy>=1.5
  # Parallelism
  - joblib>=1.3
  # Land/sea test for the tropical cyclone filter (atmotrack-tc)
  - cartopy>=0.22
  - shapely>=2.0
  # CDS download (atmotrack-download-era5)
  - python-dateutil>=2.8
  # Development / testing
  - pytest>=7.0
  - ruff>=0.4
  # pip-only packages
  - pip
  - pip:
    - cdsapi>=0.7
    - -e .
